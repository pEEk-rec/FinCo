[project]
name = "finance-copilot"
version = "0.1.0"
description = "Personal Finance & Budgeting Copilot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "tzdata; sys_platform == 'win32'",
    "pyyaml",
    "langgraph>=0.2.0",
    "jinja2>=3.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "streamlit>=1.30.0",
    "fastapi>=0.143.0",
    "uvicorn>=0.54.0",
    "httpx>=0.28.0",
]

[project.scripts]
copilot = "copilot.cli.main:app"

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff"
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501", "F811", "E402"]  # long SQL fixtures; fixtures imported by name
"src/copilot/eval/*" = ["E501"]  # markdown evaluation reports
