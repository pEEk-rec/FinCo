# What each intent means, for the model that reads questions (core/intent.llm_classify_intent).
# The model otherwise sees only the intent names. Kept short because every question pays for
# these tokens. Generic by design: what the user is trying to do, not how they might phrase it.
summarize_period: "how much was spent over a period"
explain_change: "why spending in a category changed"
investigate_anomaly: "look into an unusual transaction"
check_budget: "spending against budget limits"
forecast: "where spending is heading this month"
whatif_add_spend: "what if I spend more on something"
whatif_reduce_spend: "what if I spend less on something"
goal_check: "is a savings goal on track"
goal_progress: "how far along a goal is"
list_recurring: "regular payments and subscriptions"
alerts_overview: "warnings the system raised"
commitment_check: "is a known upcoming bill covered"
calendar_lookahead: "cash flow over the coming weeks"
bucket_status: "state of spending envelopes"
investment_readiness: "are finances ready to start investing (never what to buy)"
contribution_check: "how much could go to goals regularly"
tradeoff_compare: "compare financial options side by side"
affordability: "can I afford a specific purchase"
trip_planning: "cost of a trip or holiday"
memory_query: "what the assistant learned about my habits"
start_experiment: "begin a time-boxed challenge to change a spending habit"
experiment_status: "how my running challenge is going"
what_worked: "which of my finished challenges helped"
challenge_suggestions: "suggest challenges I could take on (not starting one)"
progress_summary: "my points, level, badges, streaks and personal bests"
unknown: "none of the above or unclear"
