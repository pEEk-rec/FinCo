# Deterministic Plan Templates (PLAN_PHASE2 Section 5.3)
# Maps each IntentType to the minimal ordered tool execution plan.

templates:
  summarize_period:
    intent_type: summarize_period
    required_tools: ["aggregate_spend_by_category"]
    allowed_tools: ["aggregate_spend_by_category", "get_balance", "get_financial_state"]
    default_steps:
      - tool_name: aggregate_spend_by_category
        arg_bindings: {"year": "{year}", "month": "{month}"}
        rationale: "Aggregate category spend totals for the requested period"

  check_budget:
    intent_type: check_budget
    required_tools: ["check_budgets"]
    allowed_tools: ["check_budgets", "aggregate_spend_by_category", "forecast_category_spend"]
    default_steps:
      - tool_name: check_budgets
        arg_bindings: {"year": "{year}", "month": "{month}"}
        rationale: "Retrieve budget warning/exceeded status for all categories"

  forecast:
    intent_type: forecast
    required_tools: ["forecast_month"]
    allowed_tools: ["forecast_month", "forecast_category_spend", "check_budgets"]
    default_steps:
      - tool_name: forecast_month
        arg_bindings: {"year": "{year}", "month": "{month}"}
        rationale: "Generate run-rate and fixed recurring spend forecast for month end"

  investigate_anomaly:
    intent_type: investigate_anomaly
    required_tools: ["detect_anomalies"]
    allowed_tools: ["detect_anomalies", "get_transactions", "investigate_anomaly"]
    default_steps:
      - tool_name: detect_anomalies
        arg_bindings: {}
        rationale: "Detect anomalies in transaction history for the target period"

  explain_change:
    intent_type: explain_change
    required_tools: ["aggregate_spend_by_category"]
    allowed_tools: ["aggregate_spend_by_category", "get_transactions", "explain_change"]
    default_steps:
      - tool_name: aggregate_spend_by_category
        arg_bindings: {"year": "{year}", "month": "{month}"}
        rationale: "Fetch category spend to evaluate historical difference"
      - tool_name: explain_change
        arg_bindings: {"period": "{period}", "category_id": "{category_id}"}
        rationale: "Decompose the change and test hypotheses for its cause"

  whatif_add_spend:
    intent_type: whatif_add_spend
    required_tools: ["check_budgets"]
    allowed_tools: ["check_budgets", "forecast_month", "run_whatif", "compare_options", "evaluate_goal_impact"]
    default_steps:
      - tool_name: check_budgets
        arg_bindings: {"year": "{year}", "month": "{month}"}
        rationale: "Fetch current budgets to simulate impact of additional spend"
      - tool_name: compare_options
        arg_bindings: {"scenarios": "{scenarios}"}
        rationale: "Compare the scenario with your current trajectory, month by month"

  whatif_reduce_spend:
    intent_type: whatif_reduce_spend
    required_tools: ["check_budgets"]
    allowed_tools: ["check_budgets", "aggregate_spend_by_category", "run_whatif", "compare_options"]
    default_steps:
      - tool_name: check_budgets
        arg_bindings: {"year": "{year}", "month": "{month}"}
        rationale: "Fetch current budgets to simulate impact of spend reduction"
      - tool_name: compare_options
        arg_bindings: {"scenarios": "{scenarios}"}
        rationale: "Compare the scenario with your current trajectory, month by month"

  goal_check:
    intent_type: goal_check
    required_tools: ["list_goals", "get_balance"]
    allowed_tools: ["get_balance", "get_financial_state", "list_goals", "evaluate_goal_impact"]
    default_steps:
      - tool_name: list_goals
        arg_bindings: {}
        rationale: "Read your active goals: target, progress and deadline"
      - tool_name: get_balance
        arg_bindings: {}
        rationale: "Check current available balance to compare against goals"

  list_recurring:
    intent_type: list_recurring
    required_tools: ["get_transactions"]
    allowed_tools: ["get_transactions"]
    default_steps:
      - tool_name: get_transactions
        arg_bindings: {"start_utc": "{start_utc}", "end_utc": "{end_utc}"}
        rationale: "Retrieve transactions to inspect recurring subscriptions"

  alerts_overview:
    intent_type: alerts_overview
    required_tools: ["check_budgets"]
    allowed_tools: ["check_budgets", "detect_anomalies", "list_alerts"]
    default_steps:
      - tool_name: check_budgets
        arg_bindings: {"year": "{year}", "month": "{month}"}
        rationale: "Inspect budget limits for active alerts"

  # Phase 3 Plan Templates (PLAN_PHASE3 Section 5.10 & 5.12)
  affordability:
    intent_type: affordability
    required_tools: ["affordability_check"]
    allowed_tools: ["affordability_check", "get_calendar", "check_commitment_coverage", "run_whatif", "evaluate_goal_impact"]
    default_steps:
      - tool_name: affordability_check
        arg_bindings: {"amount_paise": "{amount_paise}"}
        rationale: "Execute certified affordability check skill combining calendar, what-if, coverage, and goals"

  trip_planning:
    intent_type: trip_planning
    required_tools: ["trip_planning"]
    allowed_tools: ["trip_planning", "get_calendar", "plan_contributions", "compare_tradeoffs"]
    default_steps:
      - tool_name: trip_planning
        arg_bindings: {"target_amount_paise": "{amount_paise}", "target_date": "{target_date}"}
        rationale: "Execute certified trip planning skill evaluating goal, bucket, calendar buffer, and trade-offs"

  contribution_check:
    intent_type: contribution_check
    required_tools: ["contribution_review"]
    allowed_tools: ["contribution_review", "assess_investment_readiness", "plan_contributions", "list_goals"]
    default_steps:
      - tool_name: contribution_review
        arg_bindings: {"horizon_months": "6"}
        rationale: "Execute certified contribution review skill assessing readiness, waterfall feasibility, and goals"

  goal_progress:
    intent_type: goal_progress
    required_tools: ["get_goal_progress"]
    allowed_tools: ["get_goal_progress", "list_goals"]
    default_steps:
      - tool_name: get_goal_progress
        arg_bindings: {"goal_id": "{goal_id}"}
        rationale: "Fetch goal progress, required monthly pace, and projected completion date"

  commitment_check:
    intent_type: commitment_check
    required_tools: ["check_commitment_coverage"]
    allowed_tools: ["check_commitment_coverage", "get_calendar", "get_commitment_status"]
    default_steps:
      - tool_name: check_commitment_coverage
        arg_bindings: {"horizon_days": "60"}
        rationale: "Check commitment coverage against the buffer in the calendar projection"

  calendar_lookahead:
    intent_type: calendar_lookahead
    required_tools: ["get_calendar"]
    allowed_tools: ["get_calendar", "check_commitment_coverage"]
    default_steps:
      - tool_name: get_calendar
        arg_bindings: {"horizon_days": "60"}
        rationale: "Project daily cash flow, running balances, and shortfall days over calendar horizon"

  bucket_status:
    intent_type: bucket_status
    required_tools: ["get_bucket_status"]
    allowed_tools: ["get_bucket_status", "list_buckets", "get_allocation_summary"]
    default_steps:
      - tool_name: get_bucket_status
        arg_bindings: {}
        rationale: "Evaluate derived bucket balance, spent amount, and status"
      - tool_name: get_allocation_summary
        arg_bindings: {}
        rationale: "Summarize reserved bucket totals and available unallocated funds"

  investment_readiness:
    intent_type: investment_readiness
    required_tools: ["assess_investment_readiness"]
    allowed_tools: ["assess_investment_readiness"]
    default_steps:
      - tool_name: assess_investment_readiness
        arg_bindings: {}
        rationale: "Assess savings cushion, cashflow stability, emergency reserve, and obligation coverage"

  tradeoff_compare:
    intent_type: tradeoff_compare
    required_tools: ["compare_tradeoffs"]
    allowed_tools: ["compare_tradeoffs", "plan_contributions", "get_calendar"]
    default_steps:
      - tool_name: compare_tradeoffs
        arg_bindings: {"horizon_months": "12"}
        rationale: "Side-by-side trade-off comparison evaluating goal completion, shortfall, and constraints"

  memory_query:
    intent_type: memory_query
    required_tools: ["list_memories"]
    allowed_tools: ["list_memories", "explain_memory"]
    default_steps:
      - tool_name: list_memories
        arg_bindings: {}
        rationale: "List active and observed behavioural memories and patterns"

