# Deterministic Plan Templates (PLAN_PHASE2 Section 5.3)
# Maps each IntentType to the minimal ordered tool execution plan.

templates:
  summarize_period:
    intent_type: summarize_period
    required_tools: ["aggregate_spend_by_category"]
    allowed_tools: ["aggregate_spend_by_category", "get_balance", "get_financial_state"]
    default_steps:
      - tool_name: aggregate_spend_by_category
        arg_bindings: {"year": "{year}", "month": "{month}"}
        rationale: "Aggregate category spend totals for the requested period"

  check_budget:
    intent_type: check_budget
    required_tools: ["check_budgets"]
    allowed_tools: ["check_budgets", "aggregate_spend_by_category", "forecast_category_spend"]
    default_steps:
      - tool_name: check_budgets
        arg_bindings: {"year": "{year}", "month": "{month}"}
        rationale: "Retrieve budget warning/exceeded status for all categories"

  forecast:
    intent_type: forecast
    required_tools: ["forecast_month"]
    allowed_tools: ["forecast_month", "forecast_category_spend", "check_budgets"]
    default_steps:
      - tool_name: forecast_month
        arg_bindings: {"year": "{year}", "month": "{month}"}
        rationale: "Generate run-rate and fixed recurring spend forecast for month end"

  investigate_anomaly:
    intent_type: investigate_anomaly
    required_tools: ["detect_anomalies"]
    allowed_tools: ["detect_anomalies", "get_transactions", "investigate_anomaly"]
    default_steps:
      - tool_name: detect_anomalies
        arg_bindings: {}
        rationale: "Detect anomalies in transaction history for the target period"

  explain_change:
    intent_type: explain_change
    required_tools: ["aggregate_spend_by_category"]
    allowed_tools: ["aggregate_spend_by_category", "get_transactions", "explain_change"]
    default_steps:
      - tool_name: aggregate_spend_by_category
        arg_bindings: {"year": "{year}", "month": "{month}"}
        rationale: "Fetch category spend to evaluate historical difference"
      - tool_name: explain_change
        arg_bindings: {"period": "{period}", "category_id": "{category_id}"}
        rationale: "Decompose the change and test hypotheses for its cause"

  whatif_add_spend:
    intent_type: whatif_add_spend
    required_tools: ["check_budgets"]
    allowed_tools: ["check_budgets", "forecast_month", "run_whatif", "compare_options", "evaluate_goal_impact"]
    default_steps:
      - tool_name: check_budgets
        arg_bindings: {"year": "{year}", "month": "{month}"}
        rationale: "Fetch current budgets to simulate impact of additional spend"
      - tool_name: compare_options
        arg_bindings: {"scenarios": "{scenarios}"}
        rationale: "Compare the scenario with your current trajectory, month by month"

  whatif_reduce_spend:
    intent_type: whatif_reduce_spend
    required_tools: ["check_budgets"]
    allowed_tools: ["check_budgets", "aggregate_spend_by_category", "run_whatif", "compare_options"]
    default_steps:
      - tool_name: check_budgets
        arg_bindings: {"year": "{year}", "month": "{month}"}
        rationale: "Fetch current budgets to simulate impact of spend reduction"
      - tool_name: compare_options
        arg_bindings: {"scenarios": "{scenarios}"}
        rationale: "Compare the scenario with your current trajectory, month by month"

  goal_check:
    intent_type: goal_check
    required_tools: ["list_goals", "get_balance"]
    allowed_tools: ["get_balance", "get_financial_state", "list_goals", "evaluate_goal_impact"]
    default_steps:
      - tool_name: list_goals
        arg_bindings: {}
        rationale: "Read your active goals: target, progress and deadline"
      - tool_name: get_balance
        arg_bindings: {}
        rationale: "Check current available balance to compare against goals"

  list_recurring:
    intent_type: list_recurring
    required_tools: ["get_transactions"]
    allowed_tools: ["get_transactions"]
    default_steps:
      - tool_name: get_transactions
        arg_bindings: {"start_utc": "{start_utc}", "end_utc": "{end_utc}"}
        rationale: "Retrieve transactions to inspect recurring subscriptions"

  alerts_overview:
    intent_type: alerts_overview
    required_tools: ["check_budgets"]
    allowed_tools: ["check_budgets", "detect_anomalies", "list_alerts"]
    default_steps:
      - tool_name: check_budgets
        arg_bindings: {"year": "{year}", "month": "{month}"}
        rationale: "Inspect budget limits for active alerts"
