# Tool Capability Matrix for Dynamic Planning (PLAN_PHASE2 Section 5.1)
# RULE: Only 'read' and 'compute' tools may have planner_selectable: true.
# Write-class tools are NEVER planner-selectable.

tools:
  # Phase 1 Read Tools (Planner Selectable)
  get_transactions:
    planner_selectable: true
    tool_class: read
    cost: cheap
    short_description: "List transactions for a user across a UTC time window or category"
    intents: ["summarize_period", "explain_change", "investigate_anomaly"]

  get_balance:
    planner_selectable: true
    tool_class: read
    cost: cheap
    short_description: "Get current total or per-account balance in integer paise"
    intents: ["summarize_period", "goal_check"]

  aggregate_spend_by_category:
    planner_selectable: true
    tool_class: read
    cost: cheap
    short_description: "Get aggregated net category spend for an IST calendar month in paise"
    intents: ["summarize_period", "explain_change", "check_budget", "alerts_overview"]

  check_budgets:
    planner_selectable: true
    tool_class: read
    cost: cheap
    short_description: "Check budget performance status (ok, warning, exceeded) for a month"
    intents: ["check_budget", "alerts_overview", "whatif_add_spend"]

  forecast_category_spend:
    planner_selectable: true
    tool_class: read
    cost: cheap
    short_description: "Compute run-rate forecast of month-end spend for a single category"
    intents: ["forecast", "check_budget", "whatif_add_spend"]

  forecast_month:
    planner_selectable: true
    tool_class: read
    cost: cheap
    short_description: "Forecast month-end total spend and category breakdown"
    intents: ["forecast", "alerts_overview"]

  detect_anomalies:
    planner_selectable: true
    tool_class: read
    cost: medium
    short_description: "Detect unusual spend transactions and velocity spikes"
    intents: ["investigate_anomaly", "alerts_overview"]

  get_financial_state:
    planner_selectable: true
    tool_class: read
    cost: cheap
    short_description: "Get a comprehensive snapshot of accounts, budgets, and spend"
    intents: ["summarize_period", "goal_check", "alerts_overview"]

  # Phase 1 Write Tools (Permanently NOT Planner Selectable)
  recategorize_transaction:
    planner_selectable: false
    tool_class: write_logical
    cost: medium
    short_description: "User or approved agent change of a transaction's category"
    intents: []

  categorize_batch:
    planner_selectable: false
    tool_class: write_logical
    cost: expensive
    short_description: "Batch update of transactions by automated rule pipeline"
    intents: []

  undo_categorize_batch:
    planner_selectable: false
    tool_class: write_logical
    cost: expensive
    short_description: "Revert a batch categorization run"
    intents: []

  ingest_statements:
    planner_selectable: false
    tool_class: write_logical
    cost: expensive
    short_description: "Fetch and ingest statements under valid AA consent"
    intents: []

  detect_transfers:
    planner_selectable: false
    tool_class: write_logical
    cost: medium
    short_description: "Identify own-account transfers and exclude them from spend"
    intents: []

  detect_recurring:
    planner_selectable: false
    tool_class: write_logical
    cost: medium
    short_description: "Detect recurring subscription and bill payment series"
    intents: ["list_recurring"]

  undo:
    planner_selectable: false
    tool_class: write_logical
    cost: medium
    short_description: "Revert a single audited state mutation"
    intents: []

  draft_advice:
    planner_selectable: false
    tool_class: write_logical
    cost: medium
    short_description: "Generate draft financial advice for user review"
    intents: []

  decide_advice:
    planner_selectable: false
    tool_class: write_logical
    cost: cheap
    short_description: "User approve or reject decision on draft advice"
    intents: []

  create_goal:
    planner_selectable: false
    tool_class: write_logical
    cost: cheap
    short_description: "Create a new financial savings or purchase goal"
    intents: []

  update_goal:
    planner_selectable: false
    tool_class: write_logical
    cost: cheap
    short_description: "Update an existing financial goal's target, progress, or deadline"
    intents: []

  list_goals:
    planner_selectable: true
    tool_class: read
    cost: cheap
    short_description: "List the user's active or paused financial goals"
    intents: ["goal_check", "summarize_period"]

  get_goal_progress:
    planner_selectable: true
    tool_class: read
    cost: cheap
    short_description: "Evaluate current balance, pace, and projected completion for a goal"
    intents: ["goal_check", "goal_progress", "summarize_period"]

  record_goal_contribution:
    planner_selectable: false
    tool_class: write_logical
    cost: cheap
    short_description: "Record a manual contribution or withdrawal against a savings goal"
    intents: []

  evaluate_goal_impact:
    planner_selectable: true
    tool_class: compute
    cost: cheap
    short_description: "Evaluate the impact of a spending decision on active goals"
    intents: ["goal_check", "whatif_add_spend"]

  run_whatif:
    planner_selectable: true
    tool_class: compute
    cost: medium
    short_description: "Simulate financial outcomes of spending or contribution scenarios"
    intents: ["whatif_add_spend", "whatif_reduce_spend", "goal_check"]

  compare_options:
    planner_selectable: true
    tool_class: compute
    cost: medium
    short_description: "Compare multiple what-if spending options side-by-side"
    intents: ["whatif_add_spend", "whatif_reduce_spend"]

  investigate_anomaly:
    planner_selectable: true
    tool_class: compute
    cost: medium
    short_description: "Investigate a detected financial anomaly using the hypothesis catalogue"
    intents: ["investigate_anomaly", "alerts_overview"]

  explain_change:
    planner_selectable: true
    tool_class: compute
    cost: medium
    short_description: "Explain period-over-period spend changes via deterministic decomposition"
    intents: ["explain_change", "summarize_period"]

  dismiss_anomaly:
    planner_selectable: false
    tool_class: write_logical
    cost: cheap
    short_description: "User tool to dismiss a detected anomaly as expected"
    intents: []

  evaluate_alerts:
    planner_selectable: false
    tool_class: write_logical
    cost: medium
    short_description: "Evaluate spend and budget signals and generate adaptive alerts"
    intents: []

  decide_alert:
    planner_selectable: false
    tool_class: write_logical
    cost: cheap
    short_description: "User tool to acknowledge, dismiss, or snooze an alert"
    intents: []

  set_alert_preference:
    planner_selectable: false
    tool_class: write_logical
    cost: cheap
    short_description: "User tool to set alert preferences, silences, or limits"
    intents: []

  list_alerts:
    planner_selectable: true
    tool_class: read
    cost: cheap
    short_description: "List active or historical adaptive alerts for the user"
    intents: ["alerts_overview", "summarize_period"]

  approve_consent:
    planner_selectable: false
    tool_class: write_logical
    cost: cheap
    short_description: "Record the user's consent"
    intents: []

  revoke_consent:
    planner_selectable: false
    tool_class: write_logical
    cost: cheap
    short_description: "Withdraw the user's consent"
    intents: []

  build_monthly_review:
    planner_selectable: false
    tool_class: write_logical
    cost: cheap
    short_description: "Build the monthly review"
    intents: []

  # Phase 3 Commitments Tools
  list_commitments:
    planner_selectable: true
    tool_class: read
    cost: cheap
    short_description: "List commitments and recurrence schedules for a user"
    intents: ["commitment_check", "summarize_period"]

  get_commitment_status:
    planner_selectable: true
    tool_class: read
    cost: cheap
    short_description: "Get status, due dates, and match history for a commitment"
    intents: ["commitment_check"]

  create_commitment:
    planner_selectable: false
    tool_class: write_logical
    cost: cheap
    short_description: "Create a new financial commitment"
    intents: []

  update_commitment:
    planner_selectable: false
    tool_class: write_logical
    cost: cheap
    short_description: "Update a financial commitment"
    intents: []

  pause_commitment:
    planner_selectable: false
    tool_class: write_logical
    cost: cheap
    short_description: "Pause an active commitment"
    intents: []

  end_commitment:
    planner_selectable: false
    tool_class: write_logical
    cost: cheap
    short_description: "End an active commitment"
    intents: []

  accept_commitment:
    planner_selectable: false
    tool_class: write_logical
    cost: cheap
    short_description: "Accept a suggested draft commitment"
    intents: []

  reject_commitment:
    planner_selectable: false
    tool_class: write_logical
    cost: cheap
    short_description: "Reject a suggested commitment"
    intents: []

  suggest_commitments:
    planner_selectable: false
    tool_class: write_logical
    cost: medium
    short_description: "Suggest draft commitments from recurring payment series"
    intents: []

  # Phase 3 Virtual Buckets Tools
  list_buckets:
    planner_selectable: true
    tool_class: read
    cost: cheap
    short_description: "List virtual spending, goal, and flexible buckets"
    intents: ["bucket_check", "summarize_period"]

  get_bucket_status:
    planner_selectable: true
    tool_class: read
    cost: cheap
    short_description: "Evaluate derived balance, spend, and status for a virtual bucket"
    intents: ["bucket_check"]

  get_allocation_summary:
    planner_selectable: true
    tool_class: read
    cost: cheap
    short_description: "Summarize reserved bucket totals and available unallocated funds"
    intents: ["bucket_check", "summarize_period"]

  create_bucket:
    planner_selectable: false
    tool_class: write_logical
    cost: cheap
    short_description: "Create a new virtual bucket"
    intents: []

  update_bucket:
    planner_selectable: false
    tool_class: write_logical
    cost: cheap
    short_description: "Update properties of an existing virtual bucket"
    intents: []

  archive_bucket:
    planner_selectable: false
    tool_class: write_logical
    cost: cheap
    short_description: "Archive a virtual bucket"
    intents: []

  map_category_to_bucket:
    planner_selectable: false
    tool_class: write_logical
    cost: cheap
    short_description: "Map a category to a virtual bucket"
    intents: []

  allocate_to_bucket:
    planner_selectable: false
    tool_class: write_logical
    cost: cheap
    short_description: "Allocate funds to a virtual bucket"
    intents: []

  release_from_bucket:
    planner_selectable: false
    tool_class: write_logical
    cost: cheap
    short_description: "Release funds from a virtual bucket"
    intents: []

  reassign_between_buckets:
    planner_selectable: false
    tool_class: write_logical
    cost: cheap
    short_description: "Reassign funds between two virtual buckets"
    intents: []

  draft_reallocation:
    planner_selectable: false
    tool_class: write_logical
    cost: cheap
    short_description: "Draft a reallocation between buckets"
    intents: []

  create_reallocation_draft:
    planner_selectable: false
    tool_class: write_logical
    cost: cheap
    short_description: "Create a reallocation draft between buckets"
    intents: []

  decide_reallocation:
    planner_selectable: false
    tool_class: write_logical
    cost: cheap
    short_description: "Decide on a reallocation draft"
    intents: []

  decide_reallocation_draft:
    planner_selectable: false
    tool_class: write_logical
    cost: cheap
    short_description: "Decide on a reallocation draft"
    intents: []

  apply_reallocation:
    planner_selectable: false
    tool_class: write_logical
    cost: cheap
    short_description: "Apply an approved reallocation draft"
    intents: []

  apply_reallocation_draft:
    planner_selectable: false
    tool_class: write_logical
    cost: cheap
    short_description: "Apply an approved reallocation draft"
    intents: []

  # Phase 3 Financial Calendar Tools
  get_calendar:
    planner_selectable: true
    tool_class: compute
    cost: medium
    short_description: "Project daily cash flow, running balances, and commitment coverage"
    intents: ["cashflow_projection", "affordability"]

  check_commitment_coverage:
    planner_selectable: true
    tool_class: read
    cost: cheap
    short_description: "Check commitment coverage against buffer in calendar projection"
    intents: ["commitment_check", "affordability"]

  # Phase 3 Investment Readiness Tools
  assess_investment_readiness:
    planner_selectable: true
    tool_class: compute
    cost: medium
    short_description: "Assess savings capacity and financial cushion against readiness criteria"
    intents: ["readiness_check", "affordability"]

  get_readiness_assessment:
    planner_selectable: true
    tool_class: compute
    cost: medium
    short_description: "Assess savings capacity and financial cushion against readiness criteria"
    intents: ["readiness_check", "affordability"]

  # Phase 3 Contribution Planning and Trade-off Tools
  plan_contributions:
    planner_selectable: true
    tool_class: compute
    cost: medium
    short_description: "Compute monthly waterfall contribution plan and generate options"
    intents: ["contribution_plan", "affordability"]

  compare_tradeoffs:
    planner_selectable: true
    tool_class: compute
    cost: medium
    short_description: "Compare scenario alternatives assessing cash flow and constraints"
    intents: ["tradeoff_analysis", "affordability"]

  # Phase 3 Behavioural Memory Tools
  list_memories:
    planner_selectable: true
    tool_class: read
    cost: cheap
    short_description: "List observed and confirmed behavioural memories and patterns"
    intents: ["memory_query"]

  explain_memory:
    planner_selectable: true
    tool_class: read
    cost: cheap
    short_description: "Explain evidence and confidence calculations for a memory item"
    intents: ["memory_query"]

  confirm_memory:
    planner_selectable: false
    tool_class: write_logical
    cost: cheap
    short_description: "User tool to confirm a memory candidate into active status"
    intents: []

  reject_memory:
    planner_selectable: false
    tool_class: write_logical
    cost: cheap
    short_description: "User tool to reject a memory candidate or item"
    intents: []

  edit_memory_statement:
    planner_selectable: false
    tool_class: write_logical
    cost: cheap
    short_description: "User tool to edit bounded fields of a memory statement"
    intents: []

  forget_memory:
    planner_selectable: false
    tool_class: write_logical
    cost: cheap
    short_description: "User tool to clear content and forget a memory item"
    intents: []

  refresh_memories:
    planner_selectable: true
    tool_class: compute
    cost: medium
    short_description: "Run observers to refresh behavioural memory candidates and confidence"
    intents: ["monthly_close", "memory_query"]

  record_contextual_exception:
    planner_selectable: false
    tool_class: write_logical
    cost: cheap
    short_description: "Record a contextual exception for a category and period"
    intents: []

  rollover_buckets:
    planner_selectable: true
    tool_class: compute
    cost: medium
    short_description: "Rollover unspent balances for reset_monthly buckets to unallocated"
    intents: ["monthly_close"]

  investigate_month_change:
    planner_selectable: true
    tool_class: compute
    cost: medium
    short_description: "Investigate period-over-period spend changes via deterministic decomposition"
    intents: ["explain_change"]

  # Skills (PLAN_PHASE3 Section 5.12)
  affordability_check:
    planner_selectable: true
    tool_class: compute
    cost: medium
    short_description: "Run affordability check skill: calendar projection, what-if spend, commitments, and goals"
    intents: ["affordability"]

  monthly_close:
    planner_selectable: true
    tool_class: compute
    cost: medium
    short_description: "Run monthly close skill: rollover buckets, refresh memory confidence, scan alerts, and draft review"
    intents: ["monthly_close"]

  trip_planning:
    planner_selectable: true
    tool_class: compute
    cost: medium
    short_description: "Run trip planning skill: goal progress, bucket allocation, calendar buffer, and trade-offs"
    intents: ["trip_planning"]

  contribution_review:
    planner_selectable: true
    tool_class: compute
    cost: medium
    short_description: "Run contribution review skill: investment readiness, contribution plan, and goal status"
    intents: ["contribution_check"]

  explain_month_change:
    planner_selectable: true
    tool_class: compute
    cost: medium
    short_description: "Run explain month change skill: causal investigation into spend changes and memory context"
    intents: ["explain_change"]

  run_skill:
    planner_selectable: true
    tool_class: compute
    cost: medium
    short_description: "Execute a certified skill procedure by name"
    intents: ["affordability", "trip_planning", "contribution_check"]
