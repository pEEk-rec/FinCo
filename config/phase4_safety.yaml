# Safety & Wellbeing Rules Configuration (PLAN_PHASE4 Section 1.3, Section 5.8, Section 8)

pressure_phrases:
  - "last chance"
  - "don't miss out"
  - "act now"
  - "hurry"
  - "time is running out"
  - "limited time"
  - "before it's gone"
  - "only today"
  - "countdown"
  - "no, i don't want to save"
  - "shame"
  - "loser"
  - "failed to save"
  - "missed out"

forbidden_encouragements:
  - "skip meals"
  - "starve"
  - "skip rent"
  - "avoid paying"
  - "delay paying"
  - "skip medicine"
  - "skip medical"
  - "stop paying bills"
  - "avoid doctor"
  - "skip groceries"
  - "stop eating"

essential_categories:
  - "rent"
  - "groceries"
  - "food_and_groceries"
  - "utilities"
  - "education"
  - "education_fees"
  - "transport"
  - "health"
  - "healthcare"
  - "insurance"
  - "emis"
  - "emis_and_loans"
  - "loan"
  - "debt"
  - "investments"

# Words that mark a category as essential whatever its id or display name is. A trailing * means
# "starts with"; otherwise the whole word must match (so "emi" does not catch "emirates").
# Product categories use ids such as housing (named Rent) and bills (named Utilities), and users
# can create their own, so ids alone are not enough. Travel counts as essential because it covers
# commuting; the conservative choice is recorded in docs/open_questions.md.
essential_keywords:
  - "rent"
  - "rental"
  - "housing"
  - "grocer*"
  - "utilit*"
  - "bill"
  - "bills"
  - "electric*"
  - "insurance*"
  - "emi"
  - "emis"
  - "loan*"
  - "debt"
  - "tuition*"
  - "school*"
  - "education*"
  - "health*"
  - "medic*"
  - "pharmac*"
  - "doctor*"
  - "hospital*"
  - "transport*"
  - "commute*"
  - "travel"
  - "fee"
  - "fees"
  - "tax"
  - "taxes"
