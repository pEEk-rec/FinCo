# SMS templates for State Bank of India (PLAN_CAPTURE Stage C2). See hdfc.yaml for the format
# and the note on checking against the owner's own corpus before enabling.
bank: sbi
status: ready
templates:
  - name: otp_guard
    kind: otp
    drop: true
    pattern: '(?i)\b(otp|one[- ]time password|verification code)\b'

  - name: upi_debit
    kind: debit
    pattern: '(?i)a/c x*(?P<account>\d{4}) debited by (?:rs\.?\s*)?(?P<amount>[\d,]+(?:\.\d{1,2})?) on date (?P<date>\d{1,2}[a-z]{3}\d{2,4}) trf to (?P<counterparty>.+?) ref ?no (?P<utr>\d{9,12})'

  - name: card_spend
    kind: debit
    pattern: '(?i)^rs\.?\s*(?P<amount>[\d,]+(?:\.\d{1,2})?)\s+spent on your sbi card ending (?P<account>\d{4}) at (?P<counterparty>.+?) on (?P<date>\d{1,2}/\d{1,2}/\d{2,4})'

  - name: atm_withdrawal
    kind: debit
    pattern: '(?i)^rs\.?\s*(?P<amount>[\d,]+(?:\.\d{1,2})?)\s+withdrawn at sbi (?P<channel>atm) from a/c x*(?P<account>\d{4}) on (?P<date>\d{1,2}[a-z]{3}\d{2,4})'

  - name: autopay_debit
    kind: autopay
    pattern: '(?i)^rs\.?\s*(?P<amount>[\d,]+(?:\.\d{1,2})?)\s+debited from a/c x*(?P<account>\d{4}) on (?P<date>\d{1,2}[a-z]{3}\d{2,4}) upi autopay mandate to (?P<counterparty>.+?) ref ?no (?P<utr>\d{9,12})'

  - name: upi_credit
    kind: credit
    pattern: '(?i)a/c x*(?P<account>\d{4}) credited by (?:rs\.?\s*)?(?P<amount>[\d,]+(?:\.\d{1,2})?)\s+on (?P<date>\d{1,2}[a-z]{3}\d{2,4}) trf from (?P<counterparty>.+?) ref ?no (?P<utr>\d{9,12})'

  - name: upi_refund
    kind: reversal
    pattern: '(?i)a/c x*(?P<account>\d{4}) credited by (?:rs\.?\s*)?(?P<amount>[\d,]+(?:\.\d{1,2})?)\s+on (?P<date>\d{1,2}[a-z]{3}\d{2,4}) refund of ref ?no (?P<utr>\d{9,12})'
