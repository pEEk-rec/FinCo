# Application settings (data, not code). Validated by copilot.core.config.Settings.
# Relative paths are resolved against the project root.

timezone: Asia/Kolkata          # month and day boundaries; the only supported value
currency: INR                   # amounts are stored as integer paise
db_path: data/copilot.db        # data/ is git-ignored
policy_path: config/policy.yaml

default_warn_threshold_pct: 80  # used when a budget is created without its own threshold
forecast_method: run_rate       # see tools.financial.run_rate_forecast
llm_max_retries: 2              # structured_call retries after the first attempt
transfer_window_hours: 48
# The model reads each question first; the rules guard its answer and are the fallback
# (PLAN_PHASE4 section 0.8). Set false, or FINCO_LLM_PRIMARY=0, to read with rules first.
llm_primary: true
llm_cache_ttl_s: 3600           # the same redacted question reuses the model's answer
recurring_tolerance_pct: 10
recurring_min_occurrences: 3

categorization_rules_path: config/categorization_rules.yaml
merchant_aliases_path: config/merchant_aliases.yaml
advice_templates_path: config/advice_templates.yaml
