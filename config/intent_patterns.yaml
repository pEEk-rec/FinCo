# Intent Patterns and Input Gate Configuration (PLAN_PHASE2 Section 5.2)

refusal_classes:
  INVESTMENT_ADVICE:
    - "(?i)\\b(which|what|should i buy|recommend)\\b.*\\b(stock|share|mutual fund|sip|crypto|bitcoin|etf|gold)\\b"
    - "(?i)\\b(best|top)\\b.*\\b(stocks|funds|investments)\\b"
    - "(?i)\\bwhich\\s+(?:sip|fund|stock)\\b"
  MONEY_MOVEMENT:
    - "(?i)\\b(send|transfer|pay|wire|withdraw|deposit)\\b.*\\b(money|rupees|rs|inr|cash|to)\\b"
    - "(?i)\\b(pay\\s+my\\s+bill|transfer\\s+funds)\\b"
    - "(?i)\\bmove\\s+money\\s+to\\s+(?:my\\s+)?(?:savings|account|bank)\\b"
    - "(?i)\\bmove\\s+money\\b"
  MARKET_PREDICTION:
    - "(?i)\\b(will\\s+nifty|will\\s+sensex|market\\s+crash|stock\\s+go\\s+up|price\\s+target)\\b"
    - "(?i)\\b(how\\s+much\\s+will\\s+my\\s+sip\\s+grow|sip\\s+growth|expected\\s+sip\\s+return)\\b"
  SENSITIVE_DATA_SUBMISSION:
    - "(?i)\\b(otp|cvv|pin|password|card\\s+number)\\b"
    - "\\b\\d{4}[-\\s]?\\d{4}[-\\s]?\\d{4}[-\\s]?\\d{4}\\b"
  OUT_OF_SCOPE:
    - "(?i)\\b(weather|recipe|movie|joke|sports\\s+score)\\b"

refusal_templates:
  INVESTMENT_ADVICE: "I cannot provide investment advice. FinCo cannot recommend specific funds, stocks, or SIP products. I can assess your investment readiness, calculate surplus headroom, and evaluate commitment coverage."
  MONEY_MOVEMENT: "FinCo does not move money, cannot move money, execute bank transfers, initiate payments, or lock funds. I provide logical budgeting, bucket tracking, and forward-looking cashflow projections."
  MARKET_PREDICTION: "FinCo does not project investment returns, compound interest, or market index growth. Balances never grow by assumption in our planning model."
  SENSITIVE_DATA_SUBMISSION: "For your security, never enter OTPs, CVVs, passwords, or full debit card numbers. Financial analysis only requires historical transaction records and category limits."
  OUT_OF_SCOPE: "I specialize strictly in personal finance, budget tracking, cashflow forecasting, and goal analysis."

