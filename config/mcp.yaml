# Model Context Protocol Server Configuration (PLAN_PHASE3 Section 5.17)

server_name: "finco-mcp"
protocol_version: "2024-11-05"
transport: "stdio"
allow_transaction_detail: false

# When empty, defaults to all planner-selectable read/compute tools and skills from the capability matrix.
# Listed here are the planner-selectable read tools:
