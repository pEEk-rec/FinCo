  - "forecast_category_spend"
  - "forecast_month"
  - "get_allocation_summary"
  - "get_balance"
  - "get_bucket_status"
  - "get_calendar"
  - "get_commitment_status"
  - "get_financial_state"
  - "get_goal_progress"
  - "get_readiness_assessment"
  - "get_transactions"
  - "investigate_anomaly"
